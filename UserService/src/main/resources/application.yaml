server:
  servlet:
    context-path: /ayushmaan
  port: 8081

spring:
  application:
    name: UserService
  datasource:
    url: jdbc:mysql://localhost:3306/ayushmaan
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
jwt:
  secretKey: ${JWT_KEY}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

