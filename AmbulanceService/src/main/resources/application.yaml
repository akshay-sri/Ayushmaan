server:
  servlet:
    context-path: /ayushmaan
  port: 8082

spring:
  application:
    name: AmbulanceService
  datasource:
    url: jdbc:mysql://localhost:3306/ayushmaan
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true