server:
  servlet:
    context-path: /ayushmaan
  port: 8081
spring:
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
  application:
    name: AIService
  redis:
    host: localhost
    port: 6379

com:
  ayushmaan:
    ai:
      ambulance-service:
        url: http://localhost:8082/ayushmaan
        endpoint: /ambulance/get

