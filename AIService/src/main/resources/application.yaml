server:
  port: 8082
spring:
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
  application:
    name: AIService
  redis:
    host: localhost
    port: 6379

com:
  ayushmaan:
    ai:
      ambulance-service:
        url: http://localhost:8082
        endpoint: /ambulance/get

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

